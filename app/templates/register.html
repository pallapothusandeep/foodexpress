{% extends "base.html" %}
{% block title %}Sign up · FoodExpress{% endblock %}
{% block content %}
<div class="panel auth">
  <h1>Create account</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Name</label><input name="name" required>
    <label>Email</label><input type="email" name="email" required>
    <label>Phone</label><input name="phone" pattern="[0-9]{10}" placeholder="10-digit mobile">
    <label>Password</label><input type="password" name="password" minlength="6" required>
    <button class="btn full">Sign up</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
</div>
{% endblock %}
