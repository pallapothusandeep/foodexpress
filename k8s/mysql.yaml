# MySQL database for FoodExpress, running inside Kubernetes.
# Data is kept on a PersistentVolume, so orders survive restarts and redeploys.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: foodexpress
            - name: MYSQL_USER
              value: foodapp
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: foodexpress-secrets, key: MYSQL_PASSWORD }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: foodexpress-secrets, key: MYSQL_ROOT_PASSWORD }
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits:   { memory: "768Mi" }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
